name: CI

# Gate every PR (and direct pushes) to main on a clean production build,
# so a broken `astro build` can never reach the deployed site.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      # Second pass with Cloudflare's documented Turnstile TEST keys (public,
      # always pass): proves the widget renders in the modal and the API
      # enforces the token. Needs a fresh dev server, so it's a separate run.
      - name: Turnstile (test keys)
        run: |
          echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA" > .dev.vars
          npx playwright test tests/turnstile.spec.ts
        env:
          TURNSTILE_E2E: "1"
          PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
